<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
</head>
<body>
  <div class="asset-screen" role="button" tabindex="0" aria-label="asset-shot3">
    <div class="statusbar"><span>٩:٤١</span><span>▲ ▮▮ ٤G</span></div>

    <div class="profile-head">
      <div class="avatar-lg">أ</div>
      <h2>أحمد العلي</h2>
      <div class="m">⚡ كهربائي · حي النزهة، الرياض</div>
      <div class="rating">★★★★★ <b>4.9</b> <span style="color:rgba(255,255,255,.8)">· 38 مراجعة</span></div>
    </div>

    <div class="screen-body" style="margin-top:-14px">
      <div style="display:flex;gap:10px">
        <div class="mini call" style="height:56px;display:grid;place-items:center;font-size:18px">📞 اتصال</div>
        <div class="mini wa" style="height:56px;display:grid;place-items:center;font-size:18px">💬 واتساب</div>
      </div>

      <div class="section-title" style="margin-top:6px">المراجعات <span>38 تقييمًا</span></div>

      <div class="review">
        <div class="top"><span class="who">سارة م.</span><span class="stars">★★★★★</span></div>
        <div class="txt">شغل نظيف وسريع، أنصح بالتعامل معه.</div>
      </div>

      <div class="review">
        <div class="top"><span class="who">يوسف ع.</span><span class="stars">★★★★☆</span></div>
        <div class="txt">محترم وملتزم بالوقت، والأسعار مناسبة.</div>
      </div>

      <div class="review">
        <div class="top"><span class="who">نورة ك.</span><span class="stars">★★★★★</span></div>
        <div class="txt">تواصلت معه على واتساب وردّ بسرعة 👌</div>
      </div>
    </div>

    <div class="fab" style="background:var(--brand);color:#fff">⭐ أضف تقييمًا</div>
  </div>
</body>
</html>
